<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f') no-repeat center/cover;
}

/* CONTAINER */
.container{
width:90%;
max-width:350px;
padding:30px;
background:rgba(0,0,0,0.6);
border-radius:15px;
color:white;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,0.5);
overflow:hidden; /* FIX */
display:flex;
flex-direction:column;
align-items:center;
}

/* TITLE */
h2{
color:#ff3c00;
margin-bottom:20px;
}

/* INPUT BOX */
.input-box{
position:relative;
width:100%;
}

/* INPUT */
input{
width:100%;
padding:12px 45px 12px 15px;
margin:10px 0;
border:none;
border-radius:25px;
outline:none;
box-sizing:border-box; /* FIX */
}

/* ICON */
.input-box i{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:#555;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:#ff3c00;
color:white;
border:none;
border-radius:25px;
cursor:pointer;
transition:0.3s;
margin-top:10px;
}

button:hover{
background:#ff5722;
transform:scale(1.05);
}

/* MESSAGES */
.error{
color:red;
font-size:14px;
display:none;
margin-top:5px;
}

.success{
color:lightgreen;
font-size:14px;
display:none;
margin-top:5px;
}

/* LINK */
a{
color:#ff3c00;
text-decoration:none;
}

a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Reset Password</h2>

<div class="error" id="errorMsg"></div>
<div class="success" id="successMsg"></div>

<!-- EMAIL -->
<input type="text" id="email" placeholder="Enter Email">

<!-- NEW PASSWORD -->
<div class="input-box">
<input type="password" id="newPassword" placeholder="New Password">
<i class="fa fa-eye" onclick="togglePassword('newPassword', this)"></i>
</div>

<!-- CONFIRM PASSWORD -->
<div class="input-box">
<input type="password" id="confirmPassword" placeholder="Confirm Password">
<i class="fa fa-eye" onclick="togglePassword('confirmPassword', this)"></i>
</div>

<button onclick="resetPassword()">Reset Password</button>

<p style="margin-top:15px;">
<a href="login.html">Back to Login</a>
</p>

</div>

<script>

/* TOGGLE PASSWORD */
function togglePassword(id, icon){
let input = document.getElementById(id);

if(input.type === "password"){
input.type = "text";
icon.classList.replace("fa-eye","fa-eye-slash");
}else{
input.type = "password";
icon.classList.replace("fa-eye-slash","fa-eye");
}
}

/* RESET FUNCTION */
function resetPassword(){

let email = document.getElementById("email").value.trim();
let pass = document.getElementById("newPassword").value;
let confirm = document.getElementById("confirmPassword").value;

let error = document.getElementById("errorMsg");
let success = document.getElementById("successMsg");

error.style.display = "none";
success.style.display = "none";

/* VALIDATION */

if(!email.endsWith("@gmail.com")){
error.innerText = "Email must end with @gmail.com";
error.style.display = "block";
return;
}

if(pass.length < 4){
error.innerText = "Password must be at least 4 characters";
error.style.display = "block";
return;
}

if(pass !== confirm){
error.innerText = "Passwords do not match";
error.style.display = "block";
return;
}

/* SUCCESS */
success.innerText = "Password reset successful!";
success.style.display = "block";

}

</script>

</body>
</html>
